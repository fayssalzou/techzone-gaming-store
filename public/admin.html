<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة إدارة TechZone Gaming</title><link href="https://googleapis.com" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;background:#060814;color:#f8fafc;min-height:100vh;background-image:radial-gradient(circle at 10% 20%,#1e1b4b 0%,#060814 80%)}.container{max-width:1200px;margin:0 auto;padding:0 20px}.navbar{background:rgba(15,23,42,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(56,189,248,0.1);padding:20px 0;margin-bottom:40px}.nav-container{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:1.5rem;color:#fff;text-shadow:0 0 12px rgba(56,189,248,0.5)}.logo span{color:#f43f5e}h1.page-title{font-weight:900;font-size:2.4rem;margin-bottom:30px;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.1)}.tabs{display:flex;gap:15px;margin-bottom:30px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:15px}.tab-btn{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;padding:12px 24px;border-radius:12px;font-weight:700;cursor:pointer;transition:0.3s;font-size:1rem}.tab-btn.active{background:rgba(244,63,94,0.1);border-color:#f43f5e;color:#f43f5e;box-shadow:0 0 15px rgba(244,63,94,0.2)}.tab-btn:hover:not(.active){background:rgba(255,255,255,0.08);color:#fff}.panel{background:rgba(30,41,59,0.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.05);border-radius:24px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.4);display:none}.panel.active{display:block}.btn-add{background:linear-gradient(135deg,#38bdf8 0%,#6366f1 100%);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:700;cursor:pointer;transition:0.3s;font-size:1rem;margin-bottom:25px;display:inline-block;box-shadow:0 4px 12px rgba(99,102,241,0.2)}.btn-add:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(56,189,248,0.4)}.admin-table{width:100%;border-collapse:collapse;margin-top:10px;text-align:right}.admin-table th{background:rgba(15,23,42,0.4);padding:16px;color:#38bdf8;font-weight:700;border-bottom:2px solid rgba(56,189,248,0.2);font-size:1rem}.admin-table td{padding:16px;border-bottom:1px solid rgba(255,255,255,0.05);color:#cbd5e1;font-size:0.95rem;vertical-align:middle}.admin-table tr:hover td{background:rgba(255,255,255,0.01);color:#fff}.btn-action{padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;border:none;transition:0.2s;font-size:0.88rem;margin-left:8px}.btn-edit{background:rgba(56,189,248,0.1);border:1px solid #38bdf8;color:#38bdf8}.btn-edit:hover{background:#38bdf8;color:#060814;box-shadow:0 0 15px rgba(56,189,248,0.3)}.btn-delete{background:rgba(244,63,94,0.1);border:1px solid #f43f5e;color:#f43f5e}.btn-delete:hover{background:#f43f5e;color:#fff;box-shadow:0 0 15px rgba(244,63,94,0.3)}a.view-store-btn{color:#38bdf8;text-decoration:none;font-weight:bold;border:1px solid rgba(56,189,248,0.3);padding:10px 20px;border-radius:12px;transition:0.3s;background:rgba(56,189,248,0.05)}a.view-store-btn:hover{background:rgba(56,189,248,0.15);box-shadow:0 0 15px rgba(56,189,248,0.2)}</style></head><body><div class="navbar"><div class="container nav-container"><div class="logo">TECHZONE <span>CONTROL</span></div><a href="/" class="view-store-btn">عرض المتجر زائر ←</a></div></div><div class="container"><h1 class="page-title">مركز التحكم بالنظام</h1><div class="tabs"><button id="tab-orders" class="tab-btn active" onclick="switchTab('orders')">الطلبات الواردة 📦</button><button id="tab-products" class="tab-btn" onclick="switchTab('products')">المستودع والعتاد 🗳️</button></div><div id="orders-panel" class="panel active"><table class="admin-table"><thead><tr><th>رقم الطلب</th><th>الزبون</th><th>العتاد المطلوب</th><th>التكلفة</th><th>الحالة</th></tr></thead><tbody id="orders-list"><tr><td colspan="5" style="text-align:center;color:#64748b">لا توجد طلبات معالجة حالياً.</td></tr></tbody></table></div><div id="products-panel" class="panel"><button class="btn-add" onclick="showAddForm()">+ إضافة عتاد جديد للمستودع</button><table class="admin-table"><thead><tr><th>العتاد</th><th>الوصف</th><th>السعر</th><th>التحكم</th></tr></thead><tbody id="products-list"></tbody></table></div></div><script>function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));if(tab==='orders'){document.getElementById('tab-orders').classList.add('active');document.getElementById('orders-panel').classList.add('active')}else{document.getElementById('tab-products').classList.add('active');document.getElementById('products-panel').classList.add('active')}}async function deleteProduct(id){if(confirm('هل أنت متأكد من حذف هذه القطعة؟')){const res = await fetch(`/api/products/${id}`,{method:'DELETE'});if(res.ok){loadAdminData()}else{alert('فشل الحذف، السيرفر يرفض طلبات الحذف الخارجي')}}}async function editProduct(id,oldName,oldPrice){const name=prompt('اسم المنتج الجديد:',oldName);const price=prompt('السعر الجديد (دج):',oldPrice);if(name&&price){const res = await fetch(`/api/products/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,emoji:'🖱️'})});if(res.ok){loadAdminData()}else{alert('فشل التعديل بسبب قيود السيرفر')}}}async function showAddForm(){const name=prompt('اسم القطعة الجديدة:');const price=prompt('السعر (دج):');const desc=prompt('الوصف:');if(name&&price){const res = await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,description:desc,emoji:'📦'})});if(res.ok){loadAdminData()}else{alert('فشل الإضافة: السيرفر يتطلب إدخال البيانات عبر قاعدة البيانات مباشرة')}}}async function loadAdminData(){try{const res=await fetch('/api/products');const products=await res.json();const list=document.getElementById('products-list');list.innerHTML=products.map(p=>`<tr><td style="font-weight:700;color:#fff">${p.name}</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description||''}</td><td style="color:#10b981;font-weight:700">${p.price} دج</td><td><button class="btn-action btn-edit" onclick="editProduct(${p.id},'${p.name}',${p.price})">تعديل</button><button class="btn-action btn-delete" onclick="deleteProduct(${p.id})">حذف</button></td></tr>`).join('')}catch(err){console.error(err)}}loadAdminData();</script></body></html>
