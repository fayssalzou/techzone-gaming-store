<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TechZone Gaming Store</title><link href="https://googleapis.com" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;background:#060814;color:#f8fafc;min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 20% 30%,#1e1b4b 0%,#060814 70%)}#bg-glow{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;background:radial-gradient(circle at 80% 70%,#311042 0%,transparent 50%);opacity:0.6}.container{max-width:1200px;margin:0 auto;padding:0 20px}.navbar{background:rgba(15,23,42,0.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(56,189,248,0.1);padding:20px 0;position:sticky;top:0;z-index:100}.nav-container{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:1.6rem;color:#fff;text-shadow:0 0 12px rgba(56,189,248,0.6);letter-spacing:1px}.logo span{color:#38bdf8}.nav-actions{display:flex;align-items:center;gap:15px}.admin-btn{background:rgba(244,63,94,0.1);border:1px solid #f43f5e;color:#f43f5e;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;transition:0.3s;box-shadow:0 0 15px rgba(244,63,94,0.1)}.admin-btn:hover{background:#f43f5e;color:#fff;box-shadow:0 0 20px rgba(244,63,94,0.4);transform:translateY(-2px)}.cart-btn{background:rgba(56,189,248,0.1);border:1px solid #38bdf8;color:#38bdf8;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;transition:0.3s;box-shadow:0 0 15px rgba(56,189,248,0.1)}.cart-btn:hover{background:#38bdf8;color:#060814;box-shadow:0 0 20px rgba(56,189,248,0.4);transform:translateY(-2px)}#cart-count{background:#f43f5e;color:#fff;padding:2px 8px;border-radius:20px;font-size:0.8rem}h1.main-title{text-align:center;font-weight:900;font-size:2.8rem;margin:50px 0 30px;color:#fff;text-shadow:0 0 30px rgba(99,102,241,0.3)}.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:35px;margin-bottom:60px}.card{background:rgba(30,41,59,0.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.05);border-radius:24px;padding:25px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}.card:hover{transform:translateY(-12px);border-color:rgba(56,189,248,0.3);box-shadow:0 20px 40px rgba(0,0,0,0.5),0 0 30px rgba(56,189,248,0.15)}.card::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#38bdf8,#a855f7);opacity:0;transition:0.3s}.card:hover::after{opacity:1}.product-media{width:100%;height:200px;display:flex;justify-content:center;align-items:center;margin-bottom:15px;background:rgba(0,0,0,0.2);border-radius:16px;padding:15px;border:1px solid rgba(255,255,255,0.01)}.product-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.6))}.gallery-nav{display:flex;gap:6px;margin-bottom:20px;background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.03)}.gallery-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.25);cursor:pointer;transition:0.2s}.gallery-dot.active{background:#38bdf8;box-shadow:0 0 10px #38bdf8;transform:scale(1.2)}h3{margin:10px 0;font-size:1.35rem;color:#fff;font-weight:700;letter-spacing:0.5px}p.desc{font-size:0.88rem;color:#94a3b8;line-height:1.6;flex-grow:1;margin-bottom:20px;height:70px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.price{font-size:1.6rem;font-weight:900;color:#10b981;margin-bottom:20px;background:rgba(16,185,129,0.08);padding:6px 20px;border-radius:30px;border:1px solid rgba(16,185,129,0.15);box-shadow:0 0 15px rgba(16,185,129,0.05)}.btn{background:linear-gradient(135deg,#38bdf8 0%,#6366f1 100%);color:#fff;border:none;padding:14px 20px;border-radius:14px;cursor:pointer;font-weight:700;width:100%;transition:0.3s;font-size:1rem;box-shadow:0 4px 12px rgba(99,102,241,0.2)}.btn:hover{background:linear-gradient(135deg,#0ea5e9 0%,#4f46e5 100%);box-shadow:0 0 25px rgba(56,189,248,0.4);transform:scale(1.02)}#cart-sidebar{position:fixed;top:0;left:-400px;width:400px;height:100vh;background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.05);z-index:200;padding:30px;display:flex;flex-direction:column;transition:0.4s cubic-bezier(0.16,1,0.3,1);box-shadow:20px 0 40px rgba(0,0,0,0.7)}#cart-sidebar.open{left:0}.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:15px}.close-cart{background:none;border:none;color:#94a3b8;font-size:1.5rem;cursor:pointer;transition:0.2s}.close-cart:hover{color:#fff}.cart-items{flex-grow:1;overflow-y:auto;margin-bottom:20px}.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)}.cart-total{border-top:1px solid rgba(255,255,255,0.1);padding-top:20px;margin-bottom:20px;display:flex;justify-content:space-between;font-weight:700;font-size:1.3rem;color:#10b981}.checkout-btn{background:#f43f5e;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;transition:0.3s;font-size:1.1rem;box-shadow:0 4px 12px rgba(244,63,94,0.2)}.checkout-btn:hover{background:#e11d48;box-shadow:0 0 20px rgba(244,63,94,0.4)}</style></head><body><div id="bg-glow"></div><div class="navbar"><div class="container nav-container"><div class="logo">TECHZONE <span>GAMING</span></div><div class="nav-actions"><a href="/admin" class="admin-btn">لوحة التحكم ⚙️</a><button class="cart-btn" onclick="toggleCart(true)">🛒 عتادي الحركي <span id="cart-count">0</span></button></div></div></div><div class="container"><h1 class="main-title">مستودع العتاد الإحترافي</h1><div id="products" class="products-grid"></div></div><div id="cart-sidebar"><div class="cart-header"><h2>حقيبة التسوق</h2><button class="close-cart" onclick="toggleCart(false)">✕</button></div><div id="cart-items" class="cart-items"></div><div class="cart-total"><span>المجموع الكلي:</span><span id="total-price">0 دج</span></div><button class="checkout-btn">⚡ إتمام الطلب الآن</button></div><script>let cart = [];function toggleCart(open){document.getElementById('cart-sidebar').classList.toggle('open',open)}function addToCart(name, price){cart.push({name, price});updateCart()}function updateCart(){document.getElementById('cart-count').innerText = cart.length;const itemsContainer = document.getElementById('cart-items');let total = 0;itemsContainer.innerHTML = cart.map(item=>{total += item.price;return`<div class="cart-item"><span>${item.name}</span><span style="color:#10b981;font-weight:700">${item.price} دج</span></div>`}).join('');document.getElementById('total-price').innerText = total + ' دج'}function changeImg(btn, src){const card = btn.closest('.card');card.querySelector('.product-img').src = src;card.querySelectorAll('.gallery-dot').forEach(d=>d.classList.remove('active'));btn.classList.add('active')}async function loadProducts(){try{const res=await fetch('/api/products');const products=await res.json();const container=document.getElementById('products');if(!products||products.length===0){container.innerHTML='<h3>لا توجد قطع عتاد معروضة حالياً.</h3>';return}container.innerHTML=products.map((p,index)=>{let mediaHtml=`<img class="product-img" id="img-${index}" src="images/mouse.png">`;let dotsHtml=`<div class="gallery-nav"><div class="gallery-dot active" onclick="changeImg(this,'images/mouse.png')"></div></div>`;const nameLower = p.name.toLowerCase();if(nameLower.includes('dahua')||nameLower.includes('ssd')){mediaHtml=`<img class="product-img" id="img-${index}" src="images/dahua/1.png" onerror="this.src='images/dahua.png'">`;dotsHtml=`<div class="gallery-nav"><div class="gallery-dot active" onclick="changeImg(this,'images/dahua/1.png')"></div><div class="gallery-dot" onclick="changeImg(this,'images/dahua/2.png')"></div><div class="gallery-dot" onclick="changeImg(this,'images/dahua/3.png')"></div></div>`}else if(nameLower.includes('mouse')||nameLower.includes('فأرة')||nameLower.includes('harpoon')){mediaHtml=`<img class="product-img" id="img-${index}" src="images/mouse/1.png" onerror="this.src='images/mouse.png'">`;dotsHtml=`<div class="gallery-nav"><div class="gallery-dot active" onclick="changeImg(this,'images/mouse/1.png')"></div><div class="gallery-dot" onclick="changeImg(this,'images/mouse/2.png')"></div><div class="gallery-dot" onclick="changeImg(this,'images/mouse/3.png')"></div></div>`}return`<div class="card"><div class="product-media">${mediaHtml}</div>${dotsHtml}<h3>${p.name}</h3><p class="desc">${p.description||''}</p><div class="price">${p.price} دج</div><button class="btn" onclick="addToCart('${p.name}', ${p.price})">تجهيز العتاد +</button></div>`}).join('')}catch(err){console.error(err)}}loadProducts();</script></body></html>
